onboarding = false

[theme]
name = "terminal"

[theme.custom]
panel_bg = "black"

[keys]
# Some muscle memories
prefix = "ctrl+a"
detach = ["prefix+q", "prefix+d"]
copy_mode = ["prefix+[", "prefix+enter"]
split_vertical = ["prefix+v", "prefix+|"]

[ui]
accent = "blue"

[ui.sound]
enabled = false

[ui.toast]
delivery = "terminal"

[ui.toast.clipboard]
enabled = true
position = "top-right" # Fix flickering in Codex
