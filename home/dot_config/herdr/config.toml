onboarding = false

[theme]
name = "rose-pine"
auto_switch = false

# [theme.custom]
# accent = "white"

[update]
# Managed with mise
version_check = false

[keys]
prefix = "ctrl+space"
next_tab = ["prefix+n", "prefix+right"]
previous_tab = ["prefix+p", "prefix+left"]
# Some muscle memories
detach = ["prefix+q", "prefix+d"]
copy_mode = ["prefix+[", "prefix+enter"]
split_vertical = ["prefix+v", "prefix+|"]

[ui]
prompt_new_tab_name = false
status_indicators = "symbols"

[ui.sound]
enabled = false

[ui.toast]
delivery = "terminal"

[ui.toast.clipboard]
enabled = true
