onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

[keys]
# Some muscle memories
detach = ["prefix+q", "prefix+d"]
copy_mode = ["prefix+[", "prefix+enter"]
split_vertical = ["prefix+v", "prefix+|"]

[ui.sound]
enabled = false

[ui.toast]
delivery = "terminal"

[ui.toast.clipboard]
enabled = true
position = "top-right" # Fix flickering in Codex
