# BEGIN_KITTY_THEME
# Tango Dark
include current-theme.conf
# END_KITTY_THEME


# Custom settings

## Font
### Font family (modified from `kitten choose-fonts`)
# BEGIN_KITTY_FONTS
font_family      family='Maple Mono NF CN' style=Light features='+calt +cv02 +cv05 -ss03 +zero'
bold_font        family='Maple Mono NF CN' style=Medium features='+calt +cv02 +cv05 -ss03 +zero'
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
### Customized font settings
font_size 13.0
modify_font underline_position 4
# ### CJK glyphs
# include cjk.conf
# ### Nerd Font glyphs
# include nerd-font.conf

## Shotcuts
kitty_mod cmd+shift
map kitty_mod+. next_tab
map kitty_mod+, previous_tab
map kitty_mod+t launch --type=tab --cwd=current
map kitty_mod+enter launch --location=split --cwd=current
map kitty_mod+\ launch --location=vsplit --cwd=current
map kitty_mod+minus launch --location=hsplit --cwd=currentt
map kitty_mod+h neighboring_window left
map kitty_mod+l neighboring_window right
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+s show_scrollback
map kitty_mod+r start_resizing_window
map kitty_mod+w select_tab
# HACK: Window Management (muscle memory from MacOS)
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
# # HACK: Map Ctrl+-/_ to Ctrl+i/o for muscle memory from VSCode
# map ctrl+- send_key ctrl+i
# map ctrl+_ send_key ctrl+o

## Window
remember_window_size no
remember_window_position no
initial_window_width 800
initial_window_height 600
window_padding_width 2

# ## Tab bar
# tab_bar_margin_height 2.0 2.0
# tab_bar_style powerline
# tab_powerline_style angled

## Misc
enabled_layouts splits
copy_on_select yes
# update_check_interval 0
scrollback_lines 10000

## MacOS
macos_option_as_alt both
macos_quit_when_last_window_closed yes
